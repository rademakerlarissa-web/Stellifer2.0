<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Stellifer</title>

    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <main class="cadastro-container">

        <!-- Área de apresentação -->
        <section class="cadastro-intro">

            <div class="logo">
                <span class="logo-estrelas">✦</span>

                <h1>Stellifer</h1>

                <span class="logo-estrelas">✦</span>
            </div>


            <h2>Comece a guardar suas histórias</h2>

            <p>
                Crie seu diário e transforme cada
                filme, livro, anime ou série em
                uma pequena lembrança.
            </p>

        </section>


        <!-- Card de cadastro -->
        <section class="cadastro-card">

            <h2>Crie sua conta</h2>

            <p class="cadastro-subtitle">
                Preencha seus dados para começar sua jornada.
            </p>


            <form id="cadastro-form">

                <div class="form-group">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nome_usuario">Nome de usuário</label>

                    <input
                        type="text"
                        id="nome_usuario"
                        name="nome_usuario"
                        placeholder="Escolha um nome de usuário"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmar-senha">Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button type="submit" class="btn-cadastro">
                    Criar minha conta
                </button>

            </form>


            <p class="login-text">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>


    <script src="js/cadastro.js"></script>

</body>

</html>
