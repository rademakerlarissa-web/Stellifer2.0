<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas anotações | Stellifer</title>

    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f1df">

    <!-- Tema: aplica a escolha salva antes de desenhar a página (evita "piscar") -->
    <script>
        (function () {
            try {
                var tema = localStorage.getItem("stellifer-tema");
                if (tema !== "claro" && tema !== "escuro") {
                    tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
                }
                document.documentElement.setAttribute("data-tema", tema);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/headerEfooter.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/paginas.css">
    <link rel="stylesheet" href="css/mascote.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">Stellifer</div>

        <nav>
            <a href="index.html">Início</a>
            <a href="diario.html" class="ativo" aria-current="page">Meu Diário</a>
            <a href="conquistas.html">Conquistas</a>
            <a href="perfil.html">Perfil</a>

            <button class="tema-toggle" id="tema-toggle" type="button"
                    aria-label="Mudar para o tema escuro" aria-pressed="false" title="Tema escuro">
                <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
            </button>
        </nav>
    </header>

    <main>

        <section class="pagina pagina-estreita">

            <a class="voltar" href="diario.html">← Voltar ao diário</a>

            <div class="pagina-topo">
                <div data-etiqueta="Memórias">
                    <h1>Minhas anotações</h1>
                    <p>Os momentos que registrei durante episódios e capítulos, do mais recente ao mais antigo.</p>
                </div>
            </div>

            <div class="barra-diario">
                <div class="busca-diario">
                    <input type="search" id="busca" placeholder="Buscar nas anotações" aria-label="Buscar anotação">
                </div>
            </div>

            <div id="lista"><div class="carregando">Reunindo suas anotações...</div></div>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>✦ Stellifer — Meu diário de histórias</p>
        <p>Feito para guardar aquilo que vivi.</p>
    </footer>

    <script src="js/conquistasDef.js"></script>
    <script src="js/stellifer.js"></script>
    <script src="js/anotacoes.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/mascote.js"></script>
</body>
</html>
