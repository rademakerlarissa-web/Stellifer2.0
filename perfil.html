<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil | Stellifer</title>

    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f1df">

    <!-- Tema: aplica a escolha salva antes de desenhar a página (evita "piscar") -->
    <script>
        (function () {
            try {
                var tema = localStorage.getItem("stellifer-tema");
                if (tema !== "claro" && tema !== "escuro") {
                    tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
                }
                document.documentElement.setAttribute("data-tema", tema);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/headerEfooter.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/paginas.css">
    <link rel="stylesheet" href="css/mascote.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">Stellifer</div>

        <nav>
            <a href="index.html">Início</a>
            <a href="diario.html">Meu Diário</a>
            <a href="conquistas.html">Conquistas</a>
            <a href="perfil.html" class="ativo" aria-current="page">Perfil</a>

            <button class="tema-toggle" id="tema-toggle" type="button"
                    aria-label="Mudar para o tema escuro" aria-pressed="false" title="Tema escuro">
                <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
            </button>
        </nav>
    </header>

    <main>

        <section class="pagina">

            <div class="pagina-topo">
                <div data-etiqueta="Meu perfil">
                    <h1>Meu Perfil</h1>
                    <p>Minha pequena identidade dentro do diário.</p>
                </div>
            </div>

            <div class="perfil-pagina">

                <aside class="perfil-grande" id="cartao-perfil" aria-label="Resumo do perfil">
                    <div class="perfil-foto-grande">
                        <img id="foto" src="imagens/perfil-placeholder.png" alt="Foto de perfil">
                    </div>

                    <h2 id="nome">...</h2>
                    <p class="arroba" id="usuario-nome"></p>

                    <span class="perfil-nivel" id="nivel">✦ Nível 1</span>

                    <div class="barra-xp">
                        <div class="barra-xp-trilho">
                            <div class="barra-xp-preenchimento" id="barra-xp" style="width:0%"></div>
                        </div>
                        <div class="barra-xp-texto">
                            <span id="xp-atual">0 XP</span>
                            <span id="xp-proximo">próximo nível: 100 XP</span>
                        </div>
                    </div>

                    <button class="botao" type="button" id="btn-editar">✏️ Editar perfil</button>
                    <button class="botao" type="button" id="btn-sair">Sair da conta</button>
                </aside>

                <div class="perfil-conteudo">

                    <div class="cartoes-numeros" id="numeros"></div>

                    <div class="painel">
                        <h2 class="secao-titulo-pequeno" style="font-family:var(--fonte-titulo);font-weight:500;font-size:24px;margin-bottom:18px">Sobre mim</h2>
                        <dl class="lista-info" id="info"></dl>
                    </div>

                    <div class="painel">
                        <div class="section-title" style="margin-bottom:18px">
                            <div>
                                <h2 style="font-size:24px">🏆 Conquistas</h2>
                                <p id="resumo-conquistas"></p>
                            </div>
                            <a href="conquistas.html">Ver todas</a>
                        </div>
                        <div class="conquistas-mini" id="conquistas-mini"></div>
                    </div>

                </div>
            </div>

        </section>

        <!-- EDITAR PERFIL -->
        <dialog class="janela" id="janela-perfil" aria-labelledby="titulo-editar">
            <button type="button" class="janela-fechar" id="fechar-perfil" aria-label="Fechar">✕</button>

            <form class="janela-corpo" id="form-perfil" novalidate>
                <h2 id="titulo-editar">Editar perfil</h2>

                <div class="erro-form" id="erro-perfil" role="alert"></div>

                <div class="foto-edicao">
                    <div class="foto-redonda"><img id="foto-previa" src="imagens/perfil-placeholder.png" alt="Prévia da foto"></div>
                    <div class="foto-botoes">
                        <label class="botao-arquivo">📷 Escolher foto
                            <input type="file" id="foto-arquivo" accept="image/*">
                        </label>
                        <button type="button" class="botao-texto perigo" id="foto-remover">Remover foto</button>
                    </div>
                </div>

                <div class="campo">
                    <label for="ed-nome">Nome</label>
                    <input type="text" id="ed-nome" maxlength="100" required>
                </div>

                <div class="campos-linha">
                    <div class="campo">
                        <label for="ed-usuario">Nome de usuário</label>
                        <input type="text" id="ed-usuario" maxlength="50" required>
                    </div>
                    <div class="campo">
                        <label for="ed-email">E-mail</label>
                        <input type="email" id="ed-email" required>
                    </div>
                </div>

                <p class="separador-form">Trocar senha <small style="font-family:var(--fonte-corpo);font-size:12px;color:var(--texto-suave)">(opcional)</small></p>

                <div class="campos-linha">
                    <div class="campo">
                        <label for="ed-senha-atual">Senha atual</label>
                        <input type="password" id="ed-senha-atual" autocomplete="current-password">
                    </div>
                    <div class="campo">
                        <label for="ed-senha-nova">Nova senha</label>
                        <input type="password" id="ed-senha-nova" autocomplete="new-password">
                    </div>
                </div>

                <div class="janela-acoes">
                    <button type="button" class="botao botao-suave" id="cancelar-perfil">Cancelar</button>
                    <button type="submit" class="botao" id="salvar-perfil">Salvar</button>
                </div>
            </form>
        </dialog>

    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>✦ Stellifer — Meu diário de histórias</p>
        <p>Feito para guardar aquilo que vivi.</p>
    </footer>

    <script src="js/conquistasDef.js"></script>
    <script src="js/stellifer.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/mascote.js"></script>
</body>
</html>
